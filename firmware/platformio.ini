; Proyecto de PlatformIO del registrador inercial (ESP32 + GY-91 + microSD).
;
; Dos formas de compilar el mismo código:
;   registro : el programa normal, que graba en la microSD.
;   prueba   : modo de prueba por monitor serie (imprime lecturas convertidas, sin usar la SD).
;
; Compilar:           pio run -e registro
; Cargar al ESP32:    pio run -e registro -t upload
; Monitor serie:      pio device monitor

[platformio]
default_envs = registro

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:registro]

[env:prueba]
build_flags = -D MODO_PRUEBA_SERIE
